{% extends 'core/base.html' %}

{% block title %}Nueva Solicitud{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>📝 Crear Nueva Solicitud</h2>
    
    <form method="post" class="mt-4">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="id_titulo" class="form-label">Título</label>
            <input type="text" name="titulo" class="form-control" id="id_titulo" required>
            <small class="form-text text-muted">Describe brevemente el propósito de tu solicitud</small>
        </div>
        
        <div class="mb-3">
            <label for="id_descripcion" class="form-label">Descripción</label>
            <textarea name="descripcion" class="form-control" id="id_descripcion" rows="5" required></textarea>
            <small class="form-text text-muted">Proporciona detalles completos</small>
        </div>
        
        <button type="submit" class="btn btn-primary">Enviar Solicitud</button>
        <a href="{% url 'lista_solicitudes' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
